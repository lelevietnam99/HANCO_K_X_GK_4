<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Chế độ No-Cache -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Ôn Tập Dịch Câu & Phiên Âm - Hán Cổ 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(17, 24, 39, 0.88);
            --card-border: rgba(212, 175, 55, 0.42);
            --gold: #f59e0b;
            --gold-light: #fde68a;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #38bdf8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
        }

        body.theme-nature {
            --bg-dark: #071f18;
            --card-bg: rgba(11, 37, 28, 0.9);
            --card-border: rgba(52, 211, 153, 0.4);
            --gold: #34d399;
            --gold-light: #a7f3d0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none;
        }

        .container {
            max-width: 1360px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        header {
            text-align: center;
            padding: 22px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            backdrop-filter: blur(10px);
            margin-bottom: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }

        header h1 {
            font-size: 1.85rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 6px;
        }

        header p {
            color: var(--gold-light);
            font-size: 0.95rem;
        }

        /* Thanh điều hướng & công cụ */
        .top-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .nav-tabs, .utility-btns {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .btn {
            padding: 9px 15px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn:hover {
            background: rgba(245, 158, 11, 0.2);
            border-color: var(--gold);
        }

        .btn.active {
            background: var(--gold);
            color: #090d16;
            border-color: var(--gold);
        }

        .view-section {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .view-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Thanh tìm kiếm & nút che đáp án */
        .control-panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .search-box:focus {
            border-color: var(--gold);
        }

        /* Thẻ câu hỏi */
        .sentence-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 22px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
            padding-bottom: 10px;
            margin-bottom: 14px;
        }

        .q-badge {
            background: var(--gold);
            color: #000;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            text-transform: uppercase;
        }

        .summary-lines {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
            background: rgba(0, 0, 0, 0.28);
            padding: 14px 16px;
            border-radius: 10px;
            border-left: 4px solid var(--gold);
        }

        .line-item {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .line-label {
            min-width: 92px;
            font-weight: 700;
            color: var(--gold-light);
            font-size: 0.92rem;
        }

        .han-sentence {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.65rem;
            font-weight: 700;
            color: var(--gold-light);
            letter-spacing: 1.5px;
        }

        .hv-sentence {
            font-size: 1.08rem;
            font-weight: 600;
            color: var(--accent-blue);
        }

        .mean-sentence {
            font-size: 1.02rem;
            color: var(--text-main);
        }

        /* Bảng giải nghĩa từng chữ Hán */
        .word-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .word-cell {
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            min-width: 78px;
            flex: 0 1 auto;
            text-align: center;
            overflow: hidden;
            transition: transform 0.15s, border-color 0.15s;
        }

        .word-cell:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        .w-han {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.55rem;
            font-weight: 700;
            color: var(--gold-light);
            padding: 6px 8px;
            background: rgba(245, 158, 11, 0.14);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .w-hv {
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 0.9rem;
            padding: 5px 6px;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .w-mean {
            font-size: 0.82rem;
            color: var(--text-muted);
            padding: 5px 6px;
            line-height: 1.3;
        }

        /* Hiệu ứng làm mờ để tự dò bài */
        .masked {
            filter: blur(8px);
            user-select: none;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .masked:hover, .masked.revealed {
            filter: blur(0);
            user-select: auto;
        }

        /* Phòng luyện tập (Tab 3) */
        .practice-box {
            max-width: 860px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 24px;
        }

        .char-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 16px 0;
            min-height: 54px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 10px;
            border: 1px dashed rgba(255, 255, 255, 0.2);
        }

        .char-tile {
            font-family: 'Noto Serif TC', serif;
            font-size: 1.5rem;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            background: rgba(245, 158, 11, 0.18);
            border: 1px solid var(--gold);
            color: var(--gold-light);
            cursor: pointer;
            user-select: none;
            transition: all 0.15s;
        }

        .char-tile:hover {
            transform: scale(1.07);
            background: var(--gold);
            color: #000;
        }

        .char-tile.used {
            opacity: 0.25;
            pointer-events: none;
        }

        /* In A4 Khổ Ngang */
        @media print {
            @page {
                size: A4 landscape;
                margin: 10mm;
            }
            body {
                background: #fff !important;
                color: #000 !important;
            }
            #bgCanvas, .top-bar, .control-panel, #view-practice {
                display: none !important;
            }
            #view-part1, #view-part2 {
                display: block !important;
            }
            header, .sentence-card, .summary-lines, .word-cell, .w-han {
                background: #fff !important;
                color: #000 !important;
                border-color: #333 !important;
                box-shadow: none !important;
                break-inside: avoid;
            }
            header h1, .han-sentence, .hv-sentence, .mean-sentence, .line-label, .w-han, .w-hv, .w-mean {
                color: #000 !important;
                filter: none !important;
            }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="container">
    <header>
        <h1>ÔN TẬP DỊCH CÂU &amp; PHIÊN ÂM - HÁN CỔ 4</h1>
        <p>Hệ Thống Học Chiết Tự Từng Chữ, Phiên Âm Hán Việt &amp; Dịch Nghĩa Toàn Câu</p>
    </header>

    <div class="top-bar">
        <div class="nav-tabs">
            <button class="btn active" onclick="switchView('part1', this)">📜 Phần 1: Cho Hán Văn ➔ Viết Hán Việt &amp; Dịch (13 Câu)</button>
            <button class="btn" onclick="switchView('part2', this)">✍️ Phần 2: Cho Hán Việt ➔ Viết Hán Văn &amp; Dịch (13 Câu)</button>
            <button class="btn" onclick="switchView('practice', this)">🎯 Phòng Luyện Thi &amp; Ghép Chữ Hán</button>
        </div>
        <div class="utility-btns">
            <button class="btn" onclick="toggleTheme()">🌌 Đổi Nền (Vũ Trụ / Rừng Trúc)</button>
            <button class="btn" onclick="window.print()">🖨️ In A4 Khổ Ngang</button>
        </div>
    </div>

    <!-- ==================== TAB 1: PHẦN 1 (13 CÂU) ==================== -->
    <section id="view-part1" class="view-section active">
        <div class="control-panel">
            <input type="text" id="searchP1" class="search-box" placeholder="🔍 Tìm kiếm trong Phần 1 (chữ Hán, phiên âm Hán Việt, nghĩa tiếng Việt...)" oninput="renderPart1()">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn" id="btnP1MaskHV" onclick="toggleMaskP1('hv')">🙈 Che Hán Việt</button>
                <button class="btn" id="btnP1MaskMean" onclick="toggleMaskP1('mean')">🙈 Che Dịch Nghĩa</button>
                <button class="btn" id="btnP1MaskTable" onclick="toggleMaskP1('table')">🙈 Che Bảng Từng Chữ</button>
            </div>
        </div>
        <div id="containerPart1"></div>
    </section>

    <!-- ==================== TAB 2: PHẦN 2 (13 CÂU) ==================== -->
    <section id="view-part2" class="view-section">
        <div class="control-panel">
            <input type="text" id="searchP2" class="search-box" placeholder="🔍 Tìm kiếm trong Phần 2 (Hán Việt, chữ Hán, nghĩa...)" oninput="renderPart2()">
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn" id="btnP2MaskHan" onclick="toggleMaskP2('han')">🙈 Che Chữ Hán</button>
                <button class="btn" id="btnP2MaskMean" onclick="toggleMaskP2('mean')">🙈 Che Dịch Nghĩa</button>
                <button class="btn" id="btnP2MaskTable" onclick="toggleMaskP2('table')">🙈 Che Bảng Từng Chữ</button>
            </div>
        </div>
        <div id="containerPart2"></div>
    </section>

    <!-- ==================== TAB 3: PHÒNG LUYỆN THI ==================== -->
    <section id="view-practice" class="view-section">
        <div class="control-panel" style="justify-content:center;">
            <button class="btn active" id="pracMode1" onclick="setPracticeMode('p1')">📖 Luyện Đề Phần 1 (Nhìn Hán Văn ➔ Đọc Hán Việt &amp; Nghĩa)</button>
            <button class="btn" id="pracMode2" onclick="setPracticeMode('p2')">🧩 Luyện Đề Phần 2 (Nhìn Hán Việt ➔ Ghép Chữ Hán &amp; Dịch)</button>
            <button class="btn" onclick="nextPracticeCard()">🔀 Đổi Câu Ngẫu Nhiên</button>
        </div>

        <div class="practice-box" id="practiceContent"></div>
    </section>
</div>

    // ==================== STATE & RENDER PHẦN 1, PHẦN 2 ====================
    let maskP1 = { hv: false, mean: false, table: false };
    let maskP2 = { han: false, mean: false, table: false };

    function removeAccents(str) {
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function renderWordGrid(words, isMasked) {
        return `<div class="word-grid ${isMasked ? 'masked' : ''}" onclick="this.classList.toggle('revealed')">
            ${words.map(w => `
                <div class="word-cell">
                    <div class="w-han">${w[0]}</div>
                    <div class="w-hv">${w[1]}</div>
                    <div class="w-mean">${w[2]}</div>
                </div>
            `).join('')}
        </div>`;
    }

    function renderPart1() {
        const q = document.getElementById('searchP1').value.trim().toLowerCase();
        const qNo = removeAccents(q);
        const box = document.getElementById('containerPart1');
        box.innerHTML = '';

        const filtered = part1Data.filter(item => {
            if (!q) return true;
            return item.han.includes(q) ||
                   removeAccents(item.hv).includes(qNo) ||
                   removeAccents(item.mean).includes(qNo) ||
                   String(item.id) === q;
        });

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = 'sentence-card';
            card.innerHTML = `
                <div class="card-header">
                    <span class="q-badge">CÂU ${item.id} (Hán Văn ➔ Hán Việt &amp; Nghĩa)</span>
                    <span style="font-size:0.85rem; color:var(--text-muted);">Số chữ: ${item.words.length} chữ</span>
                </div>
                <div class="summary-lines">
                    <div class="line-item">
                        <span class="line-label">Hán văn:</span>
                        <span class="han-sentence">${item.han}</span>
                    </div>
                    <div class="line-item">
                        <span class="line-label">Hán Việt:</span>
                        <span class="hv-sentence ${maskP1.hv ? 'masked' : ''}" onclick="this.classList.toggle('revealed')">${item.hv}</span>
                    </div>
                    <div class="line-item">
                        <span class="line-label">Nghĩa:</span>
                        <span class="mean-sentence ${maskP1.mean ? 'masked' : ''}" onclick="this.classList.toggle('revealed')">${item.mean}</span>
                    </div>
                </div>
                ${renderWordGrid(item.words, maskP1.table)}
            `;
            box.appendChild(card);
        });
    }

    function toggleMaskP1(key) {
        maskP1[key] = !maskP1[key];

                    <div class="line-item">
                        <span class="line-label">Nghĩa:</span>
                        <span class="mean-sentence ${maskP2.mean ? 'masked' : ''}" onclick="this.classList.toggle('revealed')">${item.mean}</span>
                    </div>
                </div>
                ${renderWordGrid(item.words, maskP2.table)}
            `;
            box.appendChild(card);
        });
    }

    function toggleMaskP2(key) {
        maskP2[key] = !maskP2[key];
        document.getElementById('btnP2MaskHan').classList.toggle('active', maskP2.han);
        document.getElementById('btnP2MaskMean').classList.toggle('active', maskP2.mean);
        document.getElementById('btnP2MaskTable').classList.toggle('active', maskP2.table);
        renderPart2();
    }

    // ==================== TAB 3: PHÒNG LUYỆN THI & GHÉP CHỮ ====================
    let pracMode = 'p1';
    let pracIdx = 0;
    let assembledChars = [];
    let shuffledBank = [];

    function setPracticeMode(m) {
        pracMode = m;
        document.getElementById('pracMode1').classList.toggle('active', m === 'p1');
        document.getElementById('pracMode2').classList.toggle('active', m === 'p2');
        pracIdx = 0;
        renderPractice();
    }

    function nextPracticeCard() {
        const list = pracMode === 'p1' ? part1Data : part2Data;
        pracIdx = (pracIdx + 1) % list.length;
        renderPractice();
    }

    function renderPractice() {
        const box = document.getElementById('practiceContent');
        if (pracMode === 'p1') {
            const item = part1Data[pracIdx];
            box.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                    <span class="q-badge">PHẦN 1 - CÂU ${item.id} / 13</span>
                    <div style="display:flex; gap:8px;">
                        <button class="btn" onclick="pracIdx=(pracIdx-1+13)%13; renderPractice()">⬅️ Câu Trước</button>
                        <button class="btn active" onclick="pracIdx=(pracIdx+1)%13; renderPractice()">Câu Tiếp ➡️</button>
                    </div>
                </div>
                <div style="text-align:center; padding:26px 16px; background:rgba(0,0,0,0.4); border-radius:12px; margin-bottom:16px;">
                    <p style="color:var(--text-muted); margin-bottom:8px;">Hãy đọc phiên âm Hán Việt và dịch nghĩa câu Hán văn sau:</p>
                    <div class="han-sentence" style="font-size:2.2rem;">${item.han}</div>
                </div>
                <div style="text-align:center; margin-bottom:16px;">
                    <button class="btn active" onclick="document.getElementById('p1AnsBox').style.display='block'">👁️ Hiện Đáp Án Đối Chiếu</button>
                </div>
                <div id="p1AnsBox" style="display:none; padding:16px; background:rgba(16,185,129,0.12); border:1px solid var(--accent-green); border-radius:10px;">
                    <p style="margin-bottom:8px;"><strong style="color:var(--gold-light);">Hán Việt:</strong> <span class="hv-sentence">${item.hv}</span></p>
                    <p style="margin-bottom:12px;"><strong style="color:var(--gold-light);">Nghĩa:</strong> <span>${item.mean}</span></p>
                    ${renderWordGrid(item.words, false)}
                </div>
            `;
        } else {
            const item = part2Data[pracIdx];
            assembledChars = [];
            shuffledBank = item.words.map((w, idx) => ({ char: w[0], hv: w[1], idx })).sort(() => Math.random() - 0.5);
            renderPart2Puzzle(item);
        }
    }

    function renderPart2Puzzle(item) {
        const box = document.getElementById('practiceContent');
        const targetChars = item.words.map(w => w[0]).join('');
        const currentStr = assembledChars.map(x => x.char).join('');
        const isComplete = assembledChars.length === item.words.length;
        const isCorrect = isComplete && currentStr === targetChars;

        box.innerHTML = `
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                <span class="q-badge">PHẦN 2 - CÂU ${item.id} / 13</span>
                <div style="display:flex; gap:8px;">
                    <button class="btn" onclick="pracIdx=(pracIdx-1+13)%13; renderPractice()">⬅️ Câu Trước</button>
                    <button class="btn active" onclick="pracIdx=(pracIdx+1)%13; renderPractice()">Câu Tiếp ➡️</button>
                </div>
            </div>

            <div style="text-align:center; padding:20px 16px; background:rgba(0,0,0,0.4); border-radius:12px; margin-bottom:14px;">
                <p style="color:var(--text-muted); margin-bottom:6px;">Cho câu phiên âm Hán Việt, hãy bấm chọn các chữ Hán bên dưới theo đúng thứ tự:</p>
                <div class="hv-sentence" style="font-size:1.45rem;">${item.hv}</div>
            </div>

            <div style="text-align:center; font-size:0.9rem; color:var(--gold-light);">Câu chữ Hán bạn đang ghép (Bấm vào chữ đã chọn để bỏ ra):</div>
            <div class="char-bank" id="assembledBox">
                ${assembledChars.map((c, i) => `<span class="char-tile" onclick="removeAssembled(${i})">${c.char}</span>`).join('')}
            </div>

            <div style="text-align:center; font-size:0.9rem; color:var(--text-muted);">Kho chữ Hán xáo trộn:</div>
            <div class="char-bank">
                ${shuffledBank.map((c, i) => {
                    const used = assembledChars.some(a => a.bankIndex === i);
                    return `<span class="char-tile ${used ? 'used' : ''}" onclick="pickCharTile(${i})">${c.char}</span>`;
                }).join('')}
            </div>

            ${isComplete ? `
                <div style="text-align:center; margin:12px 0; font-weight:700; font-size:1.1rem; color:${isCorrect ? 'var(--accent-green)' : 'var(--accent-red)'};">
                    ${isCorrect ? '✅ Chính xác tuyệt đối! Bạn đã ghép đúng toàn bộ câu Hán văn!' : '❌ Thứ tự chữ Hán chưa khớp, bạn có thể bấm vào chữ trên khung để xếp lại!'}
                </div>
            ` : ''}

            <div style="display:flex; justify-content:center; gap:10px; margin-top:12px;">
                <button class="btn" onclick="assembledChars=[]; renderPart2Puzzle(part2Data[pracIdx])">🔄 Xếp Lại</button>
                <button class="btn active" onclick="document.getElementById('p2AnsBox').style.display='block'">👁️ Xem Đáp Án &amp; Nghĩa</button>
            </div>

            <div id="p2AnsBox" style="display:none; margin-top:16px; padding:16px; background:rgba(16,185,129,0.12); border:1px solid var(--accent-green); border-radius:10px;">
                <p style="margin-bottom:8px;"><strong style="color:var(--gold-light);">Hán văn chuẩn:</strong> <span class="han-sentence">${item.han}</span></p>
                <p style="margin-bottom:12px;"><strong style="color:var(--gold-light);">Nghĩa:</strong> <span>${item.mean}</span></p>
                ${renderWordGrid(item.words, false)}
            </div>
        `;
    }

    function pickCharTile(bankIndex) {
        const item = part2Data[pracIdx];
        assembledChars.push({ ...shuffledBank[bankIndex], bankIndex });
        renderPart2Puzzle(item);
    }

    function removeAssembled(assembledIndex) {
        const item = part2Data[pracIdx];
        assembledChars.splice(assembledIndex, 1);
        renderPart2Puzzle(item);
    }

    // ==================== CHUYỂN TAB & ĐỔI NỀN ====================
    function switchView(viewId, btnEl) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.getElementById('view-' + viewId).classList.add('active');
        document.querySelectorAll('.nav-tabs .btn').forEach(b => b.classList.remove('active'));
        btnEl.classList.add('active');
    }

    function toggleTheme() {
        document.body.classList.toggle('theme-nature');
    }

    // Hiệu ứng nền Vũ Trụ Sao Đêm
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function initCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        stars = Array.from({ length: 135 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.7 + 0.4,
            speed: Math.random() * 0.35 + 0.08,
            alpha: Math.random()
        }));
    }

    function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const isNature = document.body.classList.contains('theme-nature');
        stars.forEach(s => {
            s.y -= s.speed;
            if (s.y < 0) {
                s.y = canvas.height;
                s.x = Math.random() * canvas.width;
            }
            ctx.beginPath();
            ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
            ctx.fillStyle = isNature
                ? `rgba(110, 231, 183, ${s.alpha})`
                : `rgba(253, 230, 138, ${s.alpha})`;
            ctx.fill();
        });
        requestAnimationFrame(animateStars);
    }

    window.addEventListener('resize', initCanvas);

    // Khởi tạo
    initCanvas();
    animateStars();
    renderPart1();
    renderPart2();
    setPracticeMode('p1');
</script>

</body>
</html>
